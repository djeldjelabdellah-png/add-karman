const catInfo = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
const craftName = (c, lang) => (c.cat === "other" && c.otherCat ? c.otherCat : catInfo(c.cat).name[lang]);
const hoodName = (hoodAr, lang) => {
  const h = NEIGHBORHOODS.find((n) => n.ar === hoodAr);
  return h ? h[lang] : hoodAr;
};

const toDb = (c) => ({
  name: c.name, email: c.email || null, cat: c.cat, other_cat: c.otherCat || null, hood: c.hood,
  exp: c.exp, phone: c.phone, bio: c.bio, status: "pending",
  rating: c.rating || 0, reviews: c.reviews || 0, gallery_urls: c.galleryUrls || [],
  review_list: c.reviewList || []
});
const fromDb = (r) => ({
  id: r.id, name: r.name, email: r.email, cat: r.cat, otherCat: r.other_cat, hood: r.hood,
  exp: r.exp, phone: r.phone, bio: r.bio, status: r.status || "pending", rating: r.rating, 
  reviews: r.reviews, galleryUrls: r.gallery_urls || [], reviewList: r.review_list || []
});

function CraftCard({ c, cat, lang, t, onClick }) {
  return (
    <div onClick={onClick} className="bg-white rounded-2xl p-4 shadow-sm border border-[#DCD5C4] cursor-pointer hover:shadow-md transition">
      <div className="flex items-start justify-between gap-3">
        <div className="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style={{ background: cat.color + "18", color: cat.color }}>
          <i className={cat.icon} style={{ fontSize: 22 }}></i>
        </div>
        <div className="flex-1 min-w-0">
          <h3 className="font-black text-[#0E3D37] text-sm truncate">{c.name}</h3>
          <p className="text-xs text-stone-600 truncate">{craftName(c, lang)} • {hoodName(c.hood, lang)}</p>
        </div>
        <div className="text-left shrink-0">
          <div className="flex items-center gap-1 text-xs font-bold text-[#D9A441]">
            <span>★</span> {Number(c.rating || 0).toFixed(1)}
          </div>
          <span className="text-[10px] text-stone-400">({c.reviews || 0})</span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("ar");
  const t = STRINGS[lang];
  const dir = lang === "ar" ? "rtl" : "ltr";

  const [list, setList] = useState(null);
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState(null);
  const [activeHood, setActiveHood] = useState(t.all);
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);
  
  // نماذج التسجيل والتعديل والتحقق
  const [form, setForm] = useState({ name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0].ar, exp: "1", phone: "", bio: "", galleryUrls: [] });
  const [pendingForm, setPendingForm] = useState(null);
  const [otpCode, setOtpCode] = useState("");
  const [generatedOtp, setGeneratedOtp] = useState("");
  
  const [editEmailInput, setEditEmailInput] = useState("");
  const [editingCraftsman, setEditingCraftsman] = useState(null);
  const [completingCraftsman, setCompletingCraftsman] = useState(null);

  // التقييمات والآراء
  const [newRatingVal, setNewRatingVal] = useState(5);
  const [newReviewerName, setNewReviewerName] = useState("");
  const [newCommentText, setNewCommentText] = useState("");
  const [isSubmittingReview, setIsSubmittingReview] = useState(false);

  const changeView = (newView) => {
    if (newView !== view) {
      window.history.pushState({ view: newView }, "");
      setView(newView);
      window.scrollTo(0, 0);
    }
  };

  useEffect(() => {
    if (!window.history.state) {
      window.history.replaceState({ view: "home" }, "");
    }
    const handlePopState = (event) => {
      if (event.state && event.state.view) {
        setView(event.state.view);
      } else {
        setView("home");
      }
    };
    window.addEventListener("popstate", handlePopState);
    return () => window.removeEventListener("popstate", handlePopState);
  }, []);

  useEffect(() => { setActiveHood(t.all); }, [lang]);
  useEffect(() => { document.documentElement.setAttribute("dir", dir); document.documentElement.setAttribute("lang", lang); }, [dir, lang]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3500);
  };

  const fetchList = async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?select=*`, { headers: SB_HEADERS });
      if (res.ok) {
        const data = await res.json();
        setList(data.map(fromDb));
      } else {
        setList([]);
      }
    } catch (e) {
      console.error("Fetch failed:", e);
      setList([]);
    }
  };

  useEffect(() => { fetchList(); }, []);

  const approved = useMemo(() => (list || []).filter((c) => c.status === "approved"), [list]);

  const filtered = useMemo(() => {
    return approved.filter((c) => {
      const matchCat = activeCat ? c.cat === activeCat : true;
      const matchHood = activeHood === t.all ? true : c.hood === activeHood;
      const matchQuery = query ? c.name.includes(query) || craftName(c, lang).includes(query) || c.bio.includes(query) : true;
      return matchCat && matchHood && matchQuery;
    }).sort((a, b) => (b.rating || 0) - (a.rating || 0));
  }, [approved, query, activeCat, activeHood, lang, t]);

  const handleRegisterSubmit = async (e) => {
    e.preventDefault();
    if (!form.name || !form.email || !form.phone || !form.bio) {
      showToast(t.requiredError);
      return;
    }
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    setGeneratedOtp(code);
    setPendingForm(form);
    setSaving(true);

    try {
      await emailjs.send("service_e9u62f9", "template_4s83w0k", {
        to_email: form.email,
        to_name: form.name,
        otp_code: code,
      });
      setSaving(false);
      changeView("verify");
    } catch (err) {
      setSaving(false);
      showToast(t.toastFailSubmit);
    }
  };

  const handleVerifyOtp = async () => {
    if (otpCode.trim() !== generatedOtp.trim()) {
      showToast(lang === "ar" ? "رمز التحقق غير صحيح" : "Invalid verification code");
      return;
    }
    setSaving(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen`, {
        method: "POST",
        headers: { ...SB_HEADERS, "Prefer": "return=representation" },
        body: JSON.stringify(toDb(pendingForm))
      });
      if (res.ok) {
        showToast(t.toastSubmitted);
        setForm({ name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0].ar, exp: "1", phone: "", bio: "", galleryUrls: [] });
        setPendingForm(null);
        setOtpCode("");
        changeView("home");
        fetchList();
      } else {
        showToast(t.toastFailSubmit);
      }
    } catch (err) {
      showToast(t.toastFailConnect);
    }
    setSaving(false);
  };

  const handleFindForEdit = async (e) => {
    e.preventDefault();
    if (!editEmailInput.trim()) return;
    setSaving(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?email=eq.${encodeURIComponent(editEmailInput.trim())}&select=*`, { headers: SB_HEADERS });
      if (res.ok) {
        const data = await res.json();
        if (data.length > 0) {
          const found = fromDb(data[0]);
          setEditingCraftsman(found);
          changeView("edit_form");
        } else {
          showToast(lang === "ar" ? "لم يتم العثور على حرفي بهذا البريد الإلكتروني" : "No craftsman found with this email");
        }
      }
    } catch (err) {
      showToast(t.toastFailConnect);
    }
    setSaving(false);
  };

  return (
    <div style={{ minHeight: "100vh" }} dir={dir}>
      <header className="sticky top-0 z-20 px-4 pt-5 pb-4" style={{ background: "#0E3D37" }}>
        <div className="flex items-center justify-between mb-4">
          <div>
            <h1 className="text-white font-black text-xl leading-tight">{t.title}</h1>
            <p className="text-[11px]" style={{ color: "#8FBFBF" }}>{t.subtitle}</p>
          </div>
          <div className="flex items-center gap-2">
            <button
              onClick={() => setLang(lang === "ar" ? "en" : "ar")}
              className="px-2.5 h-9 rounded-full flex items-center justify-center gap-1 text-white text-xs font-bold"
              style={{ background: "#1B4B4B" }}
            >
              🌐 {lang === "ar" ? "EN" : "AR"}
            </button>
          </div>
        </div>
        {(view === "home" || view === "list") && (
          <div className="flex items-center gap-2 rounded-2xl px-3 py-2.5" style={{ background: "#1B4B4B" }}>
            <span style={{ opacity: 0.6 }}>🔍</span>
            <input
              value={query}
              onChange={(e) => { setQuery(e.target.value); changeView("list"); }}
              placeholder={t.searchPlaceholder}
              className="bg-transparent outline-none text-sm text-white placeholder-[#8FBFBF] flex-1"
            />
            {query && (
              <button
                onClick={() => setQuery("")}
                type="button"
                className="text-white flex items-center justify-center shrink-0"
                style={{ opacity: 0.7, fontSize: 16, width: 18, height: 18 }}
              >
                ✕
              </button>
            )}
          </div>
        )}
      </header>

      {list === null ? (
        <div className="flex flex-col items-center justify-center py-24 text-stone-400 gap-2">
          <div className="spinner"></div>
          <span className="text-xs font-bold">{t.loading}</span>
        </div>
      ) : (
        <>
          {view === "home" && (
            <main className="px-4 pb-24">
              <div className="flex gap-2 overflow-x-auto py-4 hide-scrollbar">
                {[t.all, ...NEIGHBORHOODS.map((h) => h[lang])].map((h, idx) => {
                  const hoodValue = idx === 0 ? t.all : NEIGHBORHOODS[idx - 1].ar;
                  return (
                    <button key={h} onClick={() => setActiveHood(hoodValue)} className="whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-full border transition"
                      style={activeHood === hoodValue ? { background: "#0E3D37", color: "white", borderColor: "#0E3D37" } : { background: "white", color: "#0E3D37", borderColor: "#DCD5C4" }}>
                      {h}
                    </button>
                  );
                })}
              </div>

              <h2 className="font-black text-[#0E3D37] text-sm mb-3 mt-2">{t.chooseCategory}</h2>
              <div className="grid grid-cols-4 gap-4 mb-5">
                {CATEGORIES.map((c) => {
                  const count = approved.filter((x) => x.cat === c.id).length;
                  return (
                    <button
                      key={c.id}
                      onClick={() => {
                        setActiveCat(c.id);
                        changeView("list");
                      }}
                      className="flex flex-col items-center gap-2"
                    >
                      <div
                        className="w-20 h-20 rounded-[24px] flex items-center justify-center relative shadow-lg"
                        style={{
                          background: c.color + "18",
                          border: `2px solid ${c.color}40`,
                          boxShadow: "0 8px 20px rgba(0,0,0,.08)"
                        }}
                      >
                        <i className={c.icon} style={{ fontSize: 36, color: c.color }}></i>
                        {count > 0 && (
                          <span
                            className="absolute -top-2 -left-2 text-[11px] font-black text-white rounded-full w-6 h-6 flex items-center justify-center"
                            style={{ background: c.color }}
                          >
                            {count}
                          </span>
                        )}
                      </div>
                      <span className="font-black text-center text-[#3A3A3A]" style={{ fontSize: "14px", lineHeight: "18px" }}>
                        {c.name[lang]}
                      </span>
                    </button>
                  );
                })}
              </div>

              <div className="grid grid-cols-2 gap-2 mb-6">
                <button onClick={() => changeView("register")} className="w-full flex items-center justify-center gap-2 py-3.5 rounded-2xl font-black text-white text-xs" style={{ background: "#D9A441" }}>
                  <span>+</span> {t.registerCta}
                </button>
                <button onClick={() => changeView("edit_auth")} className="w-full flex items-center justify-center gap-2 py-3.5 rounded-2xl font-black text-white text-xs border" style={{ background: "#0E3D37", borderColor: "#0E3D37" }}>
                  <span>✏️</span> {t.editProfileCta}
                </button>
              </div>

              <div className="flex items-center justify-between mb-3">
                <h2 className="font-black text-[#0E3D37] text-sm">{t.topRated}</h2>
                <button onClick={() => changeView("list")} className="text-[11px] font-bold" style={{ color: "#D9A441" }}>{t.viewAll}</button>
              </div>
              <div className="space-y-3">
                {approved.length === 0 ? (
                  <p className="text-center text-xs text-stone-400 py-6">{t.noCraftsmenYet}</p>
                ) : (
                  [...approved].sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 3).map((c) => (
                    <CraftCard key={c.id} c={c} cat={catInfo(c.cat)} lang={lang} t={t} onClick={() => setSelected(c)} />
                  ))
                )}
              </div>
            </main>
          )}

          {view === "list" && (
            <main className="px-4 pb-24 pt-4">
              <div className="flex items-center gap-2 mb-4">
                <button onClick={() => { changeView("home"); setActiveCat(null); setQuery(""); }} className="text-[#0E3D37] font-bold text-lg">{dir === "rtl" ? "➔" : "⬅"}</button>
                <h2 className="font-black text-[#0E3D37] text-base flex-1">
                  {activeCat ? catInfo(activeCat).name[lang] : t.navSearch}
                  <span className="text-xs font-normal text-stone-500"> ({filtered.length})</span>
                </h2>
              </div>
              <div className="space-y-3">
                {filtered.map((c) => (
                  <CraftCard key={c.id} c={c} cat={catInfo(c.cat)} lang={lang} t={t} onClick={() => setSelected(c)} />
                ))}
              </div>
            </main>
          )}

          {view === "register" && (
            <main className="px-4 pb-24 pt-4">
              <div className="flex items-center gap-2 mb-4">
                <button onClick={() => changeView("home")} className="text-[#0E3D37] font-bold text-lg">{dir === "rtl" ? "➔" : "⬅"}</button>
                <h2 className="font-black text-[#0E3D37] text-base">{t.registerTitle}</h2>
              </div>
              <form onSubmit={handleRegisterSubmit} className="bg-white rounded-2xl p-4 shadow-sm border border-[#DCD5C4] space-y-4">
                <div>
                  <label className="block text-xs font-bold text-[#0E3D37] mb-1">{t.fullName}</label>
                  <input className="ipt" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#0E3D37] mb-1">{t.email}</label>
                  <input className="ipt" type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#0E3D37] mb-1">{t.craft}</label>
                  <select className="ipt" value={form.cat} onChange={(e) => setForm({ ...form, cat: e.target.value })}>
                    {CATEGORIES.map((c) => (<option key={c.id} value={c.id}>{c.name[lang]}</option>))}
                  </select>
                </div>
                {form.cat === "other" && (
                  <div>
                    <label className="block text-xs font-bold text-[#0E3D37] mb-1">{t.otherCraft}</label>
                    <input className="ipt" value={form.otherCat} onChange={(e) => setForm({ ...form, otherCat: e.target.value })} required />
                  </div>
                )}
                <div>
                  <label className="block text-xs font-bold text-[#0E3D37] mb-1">{t.neighborhood}</label>
                  <select className="ipt" value={form.hood} onChange={(e) => setForm({ ...form, hood: e.target.value })}>
                    {NEIGHBORHOODS.map((h) => (<option key={h.ar} value={h.ar}>{h[lang]}</option>))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#0E3D37] mb-1">{t.phone}</label>
                  <input className="ipt" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#0E3D37] mb-1">{t.bio}</label>
                  <textarea className="ipt" rows="3" value={form.bio} onChange={(e) => setForm({ ...form, bio: e.target.value })} required></textarea>
                </div>
                <button type="submit" disabled={saving} className="w-full py-3 rounded-xl font-black text-white text-xs" style={{ background: "#0E3D37" }}>
                  {saving ? t.submitting : t.submitBtn}
                </button>
              </form>
            </main>
          )}

          {view === "verify" && (
            <main className="px-4 pb-24 pt-4">
              <div className="flex items-center gap-2 mb-4">
                <button onClick={() => changeView("register")} className="text-[#0E3D37] font-bold text-lg">{dir === "rtl" ? "➔" : "⬅"}</button>
                <h2 className="font-black text-[#0E3D37] text-base">{t.verifyTitle}</h2>
              </div>
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#DCD5C4] space-y-4 text-center">
                <p className="text-xs text-stone-600">{t.verifySubtitle}</p>
                <div className="text-xs font-bold text-[#0E3D37] bg-[#F5F2EA] py-2 rounded-xl">{pendingForm?.email}</div>
                <input
                  className="ipt text-center text-xl tracking-widest font-black"
                  placeholder={t.verifyCodePlaceholder}
                  maxLength="4"
                  value={otpCode}
                  onChange={(e) => setOtpCode(e.target.value)}
                />
                <button onClick={handleVerifyOtp} disabled={saving} className="w-full py-3 rounded-xl font-black text-white text-xs" style={{ background: "#0E3D37" }}>
                  {saving ? t.submitting : t.confirmVerifyBtn}
                </button>
              </div>
            </main>
          )}

          {view === "edit_auth" && (
            <main className="px-4 pb-24 pt-4">
              <div className="flex items-center gap-2 mb-4">
                <button onClick={() => changeView("home")} className="text-[#0E3D37] font-bold text-lg">{dir === "rtl" ? "➔" : "⬅"}</button>
                <h2 className="font-black text-[#0E3D37] text-base">{t.editProfileCta}</h2>
              </div>
              <form onSubmit={handleFindForEdit} className="bg-white rounded-2xl p-4 shadow-sm border border-[#DCD5C4] space-y-4">
                <p className="text-xs text-stone-600">{t.emailNoticeText}</p>
                <div>
                  <label className="block text-xs font-bold text-[#0E3D37] mb-1">{t.email}</label>
                  <input className="ipt" type="email" value={editEmailInput} onChange={(e) => setEditEmailInput(e.target.value)} placeholder="name@example.com" required />
                </div>
                <button type="submit" disabled={saving} className="w-full py-3 rounded-xl font-black text-white text-xs" style={{ background: "#0E3D37" }}>
                  {saving ? t.submitting : (lang === "ar" ? "البحث عن الملف" : "Find Profile")}
                </button>
              </form>
            </main>
          )}
        </>
      )}

      {/* نافذة تفاصيل الحرفي */}
      {selected && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto p-5 relative">
            <button onClick={() => setSelected(null)} className="absolute top-4 left-4 w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-600 font-bold">✕</button>
            <div className="flex items-center gap-3 mb-4">
              <div className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0" style={{ background: catInfo(selected.cat).color + "18", color: catInfo(selected.cat).color }}>
                <i className={catInfo(selected.cat).icon} style={{ fontSize: 28 }}></i>
              </div>
              <div>
                <h3 className="font-black text-[#0E3D37] text-base">{selected.name}</h3>
                <p className="text-xs text-stone-500">{craftName(selected, lang)} • {hoodName(selected.hood, lang)}</p>
              </div>
            </div>
            <p className="text-xs text-stone-700 bg-[#F5F2EA] p-3 rounded-xl mb-4">{selected.bio}</p>
            <div className="flex gap-2">
              <a href={`tel:${selected.phone}`} className="flex-1 py-3 rounded-xl font-black text-white text-xs flex items-center justify-center gap-2" style={{ background: "#0E3D37" }}>
                <span>📞</span> {t.call}
              </a>
              <a href={`https://wa.me/213${selected.phone.replace(/^0/, '')}`} target="_blank" rel="noreferrer" className="flex-1 py-3 rounded-xl font-black text-white text-xs flex items-center justify-center gap-2" style={{ background: "#25D366" }}>
                <span>💬</span> {t.whatsapp}
              </a>
            </div>
          </div>
        </div>
      )}

      {/* شريط التنقل السفلي */}
      <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-[#DCD5C4] px-4 py-2 flex justify-around items-center z-30 shadow-lg">
        <button onClick={() => { changeView("home"); setActiveCat(null); setQuery(""); }} className={`flex flex-col items-center text-xs font-bold ${view === "home" ? "text-[#0E3D37]" : "text-stone-400"}`}>
          <i className="fa-solid fa-house text-lg mb-0.5"></i>
          <span>{t.navHome}</span>
        </button>
        <button onClick={() => changeView("list")} className={`flex flex-col items-center text-xs font-bold ${view === "list" ? "text-[#0E3D37]" : "text-stone-400"}`}>
          <i className="fa-solid fa-magnifying-glass text-lg mb-0.5"></i>
          <span>{t.navSearch}</span>
        </button>
        <button onClick={() => changeView("register")} className={`flex flex-col items-center text-xs font-bold ${view === "register" ? "text-[#0E3D37]" : "text-stone-400"}`}>
          <i className="fa-solid fa-user-plus text-lg mb-0.5"></i>
          <span>{t.navRegister}</span>
        </button>
      </nav>

      {toast && (
        <div className="fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#0E3D37] text-white px-4 py-2.5 rounded-2xl shadow-lg text-xs font-bold z-50">
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
